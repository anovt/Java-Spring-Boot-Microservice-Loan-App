server:
  port: 8080
spring:
  application:
    name: "accounts"
  profiles:
    active: "default"
  datasource:
    url: jdbc:mysql://localhost:3306/accountsdb
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
  retry:
    configs:
        default:
            maxAttempts: 3
            waitDuration: 200
            enable-exponential-backoff: true
            exponential-backoff-multiplier: 2
            ignore-exceptions:
              - java.lang.NullPointerException
            retry-exceptions:
              - java.util.concurrent.TimeoutException
  ratelimiter:
    configs:
        default:
            limitForPeriod: 1
            limitRefreshPeriod: 5000
            timeoutDuration: 1000



eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "accounts"
    description: "This microservice manages customer accounts and related operations."
    version: "1.0.0"


management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      access:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
        application: ${spring.application.name}



endpoints:
  shutdown:
    enabled: true

logging:
  level:
    com:
      loan:
        microservice:
          app:
            accounts: DEBUG